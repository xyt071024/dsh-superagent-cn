name: Feature request
description: 提一个能力建议（新的来源、面板改进、省流策略、新的自动化）
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        先说清楚「你想让它在什么情况下、替你做什么决定」，比先说「加个功能」有用得多。

        这个项目的取舍标准只有一条：**用最少的人类注意力换最大的价值。** 所以提案里请说明它会让你**少做**什么，而不只是让它**多做**什么。

        ⚠️ 别在这贴令牌、授权码、群号或邮箱地址。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我搜过已有 issue 和文档，这个能力目前确实没有
          required: true
        - label: 我贴出来的内容里没有任何凭据或真实群号 / 邮箱
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 属于哪一块
      options:
        - 新的来源（想接一个现在没有的平台）
        - 现有的来源（QQ / 微信 / 企微 / 邮箱 / 飞书 / GitHub）
        - 权限与接单（谁能派活、什么活该接）
        - 执行（工单怎么跑、目录与环境）
        - 调度与省流（模型选择、会话拆分、难度门槛）
        - 上下文与预算（归档、长任务提醒、每日上限）
        - 面板与设置
        - 自我进化（复盘、经验固化）
        - 文档
        - 其它
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你现在遇到的是什么
      description: 描述真实场景，不要描述解法。这一步最值钱——它决定这个提案会不会被理解错。
      placeholder: |
        我同时挂两个 QQ 号：一个对客户、一个对同事。
        现在两个号共用一套白名单，客户群里的人不该能派活，但我没法把他们分开。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么做
      description: 具体到「我在面板上看到什么、点哪个、它之后怎么反应」。不用写实现方案。
      placeholder: |
        每个账号一个独立的白名单和准入表，面板上按账号分开列状态。
        我在 A 号只放同事，B 号只放客户联系人。
    validations:
      required: true

  - type: textarea
    id: attention
    attributes:
      label: 它会替你省掉什么
      description: 这个功能上线后，你**不再需要**做哪件事？如果只是「更好玩」，直说也行，但请写清。
      placeholder: 不用每次加人都回头检查自己有没有加错号。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你现在怎么绕过
      description: 变通办法、手写脚本、忍着不做。这能说明问题有多疼，也能帮我们判断是不是已经有更简单的解法。
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 你觉得这算多大的改动
      description: 只是你的猜测，不用负责。
      options:
        - 小：改配置或面板文案就够
        - 中：加一个设置项或一条规则
        - 大：要新增一个来源 / 改权限模型 / 动宿主行为
        - 不知道
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 还有什么
      description: 参考链接、别的工具怎么做的、你愿意自己提 PR 吗。
    validations:
      required: false
